[package]
name = "echo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# NOTE: no final 30.0.0 of soroban-sdk exists on crates.io yet, so the
# contract pins its release candidate.
soroban-sdk = "=30.0.0-rc.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# NOTE: an empty workspace keeps the contract out of the workspace of the
# repository root, so cargo builds it alone, with its own toolchain and
# its own lock file.
[workspace]
