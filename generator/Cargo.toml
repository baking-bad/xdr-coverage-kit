[package]
name = "xdr-coverage-kit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/baking-bad/xdr-coverage-kit"
description = "Generates and checks a corpus of rare Stellar XDR shapes"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
soroban-env-host = "=30.0.1"
# NOTE: the JSON files of the corpus are the XDR-JSON of this release, so a
# new release may change the files that `check` compares.
stellar-xdr = { version = "=30.0.0", features = ["serde_json", "type_enum", "base64"] }
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["json"] }
