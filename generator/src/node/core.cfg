# The stellar-core configuration of the generator's node: a standalone
# network of one validator that closes a ledger only on request.
# The generator fills the two placeholders.

HTTP_PORT={port}
PUBLIC_HTTP_PORT=false

RUN_STANDALONE=true
MANUAL_CLOSE=true

NETWORK_PASSPHRASE="{passphrase}"

# NOTE: the node signs the value of every ledger that it closes, so a fixed
# key keeps the bytes of the corpus the same in every run. The key guards
# nothing: the network lives for one run on one machine.
NODE_SEED="SCR5VSFNEUSUUBPLZBFYGIKPYBX6YPDATINDM4GSET3A74CMBG76BHIK self"
NODE_IS_VALIDATOR=true
UNSAFE_QUORUM=true
FAILURE_SAFETY=0

DATABASE="sqlite3://stellar.db"
BUCKET_DIR_PATH="buckets"

# stellar-core appends the `LedgerCloseMeta` of every closed ledger here.
METADATA_OUTPUT_STREAM="meta.xdr"

[QUORUM_SET]
THRESHOLD_PERCENT=100
VALIDATORS=["$self"]
